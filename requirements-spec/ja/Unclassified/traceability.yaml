  program_path: demo/cbl/COADM01C.cbl
  rule_name: エラー処理とプログラム状態を初期化する
  rule_text: 管理者メニューハンドラーは、プログラム未検出時のエラー処理を確立し、エラーフラグ指標を初期状態でオフに設定しなければならない(SHALL)。
