  rule_name: 管理メニュー画面ヘッダーを設定する
  rule_text: 管理メニューヘッダー設定機能は、現在の日付と時刻を取得し、日付をMM/DD/YY形式で現在日付出力(`CURDATEO`)に、時刻をHH:MM:SS形式で現在時刻出力(`CURTIMEO`)に設定し、管理メニュー画面上のタイトル行(`TITLE01O`、`TITLE02O`)、トランザクション識別子(`TRNNAMEO`)、およびプログラム名(`PGMNAMEO`)を設定しなければならない(SHALL)。
- rule_id: 6c43f75a_9488_47cb_b772_545fd5393657
  program: COADM01C
  disposition: not_applicable
  reason: '[Pattern-classified] 表示用データフォーマット'
  program_path: demo/cbl/COADM01C.cbl
  rule_name: 管理メニューオプション表示行を構築する
  rule_text: 管理メニューオプションが画面上に配置されるべき状態が残っている間(インデックスが管理オプション件数(`CDEMO-ADMIN-OPT-COUNT`)を超えない間)、管理メニューオプション構築機能は、各オプションの番号と名称を表示文字列(`WS-ADMIN-OPT-TXT`)にフォーマットし、管理メニュー画面上の対応する番号付きオプション出力フィールド(`OPTN001O`から`OPTN010O`)に割り当てなければならない(SHALL)。
- rule_id: 2a325f67_ac29_4e20_a0b7_d19c2d8f9e3a
  program: COADM01C
  disposition: not_applicable
  reason: '[Pattern-classified] CICS/BMSプラットフォーム機構'
  program_path: demo/cbl/COADM01C.cbl
  rule_name: 選択された管理者機能プログラムへ制御を移す
  rule_text: オプション検証が成功し、選択されたプログラムがプレースホルダーでない場合、管理者メニューハンドラーは、通信領域に起点トランザクション識別子、起点プログラム名、およびプログラムコンテキスト指標のリセットを設定し、XCTLを介して選択された管理者機能プログラムへ制御を移さなければならない(SHALL)。
- rule_id: 86d7c7b9_9013_4024_a9ad_33996c1294c0
  program: COADM01C
  disposition: not_applicable
  reason: '[Pattern-classified] 画面表示機構'
  program_path: demo/cbl/COADM01C.cbl
  rule_name: 未導入のメニューオプションプログラムを処理する
  rule_text: メニューオプションのナビゲーション中にプログラムが見つからない状態が発生した場合、管理メニューコントローラーは、エラーメッセージ色(`ERRMSGC`)を緑に設定し、メッセージテキスト(`WS-MESSAGE`)に「This
    option is not installed ...」というメッセージを構成し、エラーメッセージ付きで管理メニュー画面を再表示しなければならない(SHALL)。
