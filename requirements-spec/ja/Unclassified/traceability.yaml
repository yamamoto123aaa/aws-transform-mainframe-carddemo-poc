  rule_text: WHEN ユーザーIDおよびパスワードが収集され、空でないことが検証された場合、THE User authentication and session
    routing は、ユーザーIDをキーとしてユーザーセキュリティファイル(`WS-USRSEC-FILE`)を読み込まなければならない(SHALL)。読み込みが成功し、取得したパスワードが入力されたパスワードと一致する場合、通信領域にユーザーのトランザクションID、プログラム名、ユーザーID、およびユーザータイプを設定し、ユーザータイプが管理者である場合は管理者メニュープログラムに、それ以外の場合は一般メニュープログラムに制御を移さなければならない(SHALL)。読み込みが未検出またはその他のエラーで失敗した場合は、適切なエラー処理分岐を呼び出さなければならない(SHALL)。
