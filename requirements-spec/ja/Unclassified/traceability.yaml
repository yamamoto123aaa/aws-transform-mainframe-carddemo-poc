  rule_text: 管理メニュー画面送信機能は、画面ヘッダーとメニューオプションを設定し、メッセージテキスト(`WS-MESSAGE`)をエラーメッセージ表示(`ERRMSGO`)に移し、完全に組み立てられた管理メニュー画面を端末へ送信しなければならない(SHALL)。
