  rule_name: 状態を初期化し、エントリー種別に応じて処理を振り分ける
  rule_text: '管理メニュープログラムが呼び出された場合、管理メニューコントローラーは、エラーフラグ(`WS-ERR-FLG`)とメッセージ領域をクリアしなければならない(SHALL)。その後、以下のとおり振り分けなければならない(SHALL):
