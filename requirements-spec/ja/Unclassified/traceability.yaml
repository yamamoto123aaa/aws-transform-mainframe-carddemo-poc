  rule_name: 入力されたメニューオプションを検証し処理する
  rule_text: 利用者が管理メニュー画面でEnterキーを押した場合、管理メニューオプション検証機能は、オプション入力(`OPTIONI`)をトリムして正規化し、数値のオプション番号(`WS-OPTION`)に変換して画面に表示しなければならない(SHALL)。値が数値でない場合、範囲外(管理オプション件数(`CDEMO-ADMIN-OPT-COUNT`)より大きい)である場合、またはゼロである場合は、エラーフラグ(`WS-ERR-FLG`)を有効に設定し、「Please
    enter a valid option number...」というメッセージを表示してメニューを再表示しなければならない(SHALL)。値が有効であるが対象プログラムが導入されていない場合は、「This
    option is not installed ...」を緑色で表示してメニューを再表示しなければならない(SHALL)。
