  rule_name: ユーザーのメニュー選択の処理とオプションの検証
  rule_text: ユーザーがメニューオプションを選択した後にEnterキーを押した場合、THE メニューオプション検証処理は、ユーザーのオプション入力を抽出してトリムし、スペースをゼロに変換し、数値に変換し、オプションが数値であること、メニューオプション件数（11）を超えないこと、およびゼロでないことを検証しなければならない（SHALL）。検証に失敗した場合は、エラーフラグを設定し、「Please
    enter a valid option number...」というエラーメッセージを表示すること。検証に成功した場合は、処理を継続すること。
