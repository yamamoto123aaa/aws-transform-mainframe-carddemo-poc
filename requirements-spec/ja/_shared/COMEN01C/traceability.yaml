  rule_text: 呼び出し元から通信領域を受信した場合、THE メニュー画面ハンドラは、共有コンテキストを抽出し、初回呼び出しである場合はフィールドをクリアしたメニュー画面を表示しなければならない（SHALL）。再入力の場合は、ユーザーの入力を受信し、押されたキーに基づいて処理を振り分けること。Enterキーが押された場合はメニュー選択を処理し、PF3キーが押された場合は別処理経路で処理し、それ以外のキーの場合は無効キーのエラーメッセージを表示すること。
