  rule_name: 承認の有効期限を評価し、サマリー合計を更新する
  rule_text: 承認詳細レコードが取得され、有効期限評価の準備が整った場合、承認有効期限評価機能は、格納された日付を反転させて現在日付と比較することにより承認の経過日数を算出しなければならない。経過日数がしきい値を超え、かつ応答コードが'00'である場合は、承認件数と承認金額を減算しなければならない。経過日数がしきい値を超え、かつ応答コードが'00'でない場合は、拒否件数と拒否金額を減算しなければならない。経過日数がしきい値を超えない場合は、当該承認を削除対象外として記録しなければならない。
