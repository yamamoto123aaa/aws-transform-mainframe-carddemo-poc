  rule_name: セキュリティファイルに対してユーザーを認証
  rule_text: ユーザーIDとパスワードが収集され、空でないことが検証されると、ユーザー認証およびセッションルーティング処理は、ユーザーIDをキーとしてユーザーセキュリティファイル（`WS-USRSEC-FILE`)を読み込み、読み込みが成功し、取得したパスワードが入力されたパスワードと一致する場合、通信領域にユーザーの取引ID、プログラム名、ユーザーID、およびユーザータイプを設定し、ユーザータイプが管理者であれば管理者メニュープログラムへ、それ以外であれば一般メニュープログラムへ制御を移し、読み込みが未検出またはその他のエラーで失敗した場合は適切なエラー処理分岐を呼び出さなければならない。
  req_id: REQ-F-081
