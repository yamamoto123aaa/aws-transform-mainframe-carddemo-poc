  rule_name: セキュリティファイルに対する利用者資格情報の確認
  rule_text: 利用者が有効かつ空でない資格情報を送信すると、利用者資格情報確認処理は、ユーザーIDをキーとしてユーザーセキュリティファイル（`WS-USRSEC-FILE`）を読み込み、読み込みが成功した場合に保存されたパスワードと入力されたパスワードを比較し、パスワードが一致しない場合は'Wrong
    Password. Try again ...'を表示して画面を再表示し、ユーザーIDが見つからない場合は'User not found. Try again
    ...'を表示して画面を再表示し、読み込み中にシステムエラーが発生した場合は'Unable to verify the User ...'を表示して画面を再表示しなければならない。
