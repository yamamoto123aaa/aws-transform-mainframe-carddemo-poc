  program_path: demo/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl
  rule_name: プログラムの初回エントリー時にアカウント詳細を収集する
  rule_text: プログラムが初めて実行されたとき（プログラム再入コンテキストが未設定のとき）、Account Details Retrievalは、出力画面バッファをクリアしなければならない（SHALL）。アカウント詳細収集ルーチンを呼び出して顧客名、住所、電話番号、アカウント限度額、および承認サマリーを取得しなければならない（SHALL）。画面消去フラグ（`WS-SEND-ERASE-FLG`）を'Y'に設定しなければならない（SHALL）。設定済みの承認リスト画面を表示しなければならない（SHALL）。
- rule_id: 12d11e9c_ae4a_4f4b_b39b_734578bc1434
  program: COPAUS0C
  disposition: captured
  rule_name: 画面に承認リストを設定する
  rule_text: エラーフラグが設定されておらず、承認レコードが利用可能である間、Authorization List Populatorは、インデックスカウンタ（`WS-IDX`）を1に初期化しなければならない（SHALL）。インデックスカウンタが5を超えるか、ファイル終端フラグ（`WS-AUTHS-EOF`）が設定されるか、エラーフラグ（`WS-ERR-FLG`）が設定されるまで継続するループに入らなければならない（SHALL）。各繰り返しにおいて、PF7キーが押下されており、かつインデックスカウンタが1であるかを確認しなければならない（SHALL）。該当する場合、承認再位置決めルーチンを呼び出して保存済みの承認キーへカーソルを位置決めしなければならない（SHALL）。該当しない場合、承認取得ルーチンを呼び出して次の承認レコードを取得しなければならない（SHALL）。承認レコードが正常に取得され、エラーフラグが設定されていない場合、承認リスト設定ルーチンを呼び出してその承認の画面フィールドを設定し、インデックスカウンタを加算しなければならない（SHALL）。ループ完了後、さらに承認が利用可能であり、エラーフラグが設定されていない場合、承認取得ルーチンをもう一度呼び出して次ページが存在するかを確認しなければならない（SHALL）。
