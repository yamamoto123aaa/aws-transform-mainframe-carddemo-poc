  rule_name: ナビゲーションコンテキストを準備し、宛先へ制御を移す
  rule_text: Authorization Screen Handlerは、宛先プログラムを検証し（未設定の場合はサインオン画面をデフォルトとする）、発信元のトランザクションIDおよびプログラムIDを設定し、プログラムコンテキストを初期状態にリセットし、CICS
    XCTLを介して宛先プログラムへ制御を移さなければならない（SHALL）。
- rule_id: 00455550_a5fd_446f_a0f3_54ad03294723
  program: COPAUS0C
  disposition: not_applicable
  reason: '[Pattern-classified] CICS/BMSプラットフォーム機構'
  program_path: demo/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl
  rule_name: 前ページナビゲーション用のPF7キーを処理する
  rule_text: ユーザーが前ページへ移動するためにPF7キーを押下したとき、Previous Page Navigatorは、現在のページ番号（`CDEMO-CPVS-PAGE-NUM`）が1より大きいかを確認しなければならない（SHALL）。大きい場合、ページ番号を減算し、通信エリア（`CDEMO-CPVS-PAUKEY-PREV-PG`）から前ページ用の保存済み承認キーを取得し、承認サマリー取得ルーチンを呼び出してそのキーから承認サマリーを取得し、画面消去フラグ（`WS-SEND-ERASE-FLG`）を'N'に設定し、承認リスト表示フィールドを初期化し、承認リストに前ページのレコードを設定しなければならない（SHALL）。1ページ目に既にいる場合、エラーメッセージ「You
    are already at the top of the page...」を表示し、画面消去フラグを'N'に設定しなければならない（SHALL）。
- rule_id: 29ac8b77_84e1_412d_aac0_cc747349f023
  program: COPAUS0C
  disposition: not_applicable
  reason: '[Pattern-classified] CICS/BMSプラットフォーム機構'
  program_path: demo/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl
  rule_name: 承認リスト画面を表示する
  rule_text: 承認リスト画面をユーザーへ表示する必要があるとき、Screen Display Handlerは、ヘッダー情報設定ルーチンを呼び出して画面ヘッダーフィールドを設定しなければならない（SHALL）。メッセージテキストをエラーメッセージ出力フィールドに移送しなければならない（SHALL）。画面消去フラグ（`WS-SEND-ERASE-FLG`）を確認しなければならない（SHALL）。フラグが'Y'に設定されている場合、表示前に画面をクリアするためERASEオプション付きで画面を送信しなければならない（SHALL）。フラグが'N'に設定されている場合、既存の画面内容を保持するためERASEオプションなしで画面を送信しなければならない（SHALL）。
- rule_id: 64ec20d9_9410_4e9c_a08e_51efdd150756
  program: COPAUS0C
  disposition: not_applicable
  reason: '[Pattern-classified] CICS/BMSプラットフォーム機構'
  program_path: demo/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl
  rule_name: 次ページナビゲーション用のPF8キーを処理する
  rule_text: ユーザーが次ページへ移動するためにPF8キーを押下したとき、Next Page Navigatorは、通信エリアに最終承認キー（`CDEMO-CPVS-PAUKEY-LAST`）が存在するかを確認しなければならない（SHALL）。存在する場合、そのキーを開始点として保存し、承認サマリー取得ルーチンを呼び出してそのキーから承認サマリーを取得し、承認再位置決めルーチンを呼び出してそのキーへカーソルを位置決めしなければならない（SHALL）。アカウントID入力フィールドの長さを-1に、画面消去フラグ（`WS-SEND-ERASE-FLG`）を'N'に設定しなければならない（SHALL）。次ページフラグ（`CDEMO-CPVS-NEXT-PAGE-FLG`）が'Y'に設定されているかを確認しなければならない（SHALL）。設定されている場合、承認リスト表示フィールドを初期化し、承認リストに次ページのレコードを設定しなければならない（SHALL）。既に最下部にいる場合、エラーメッセージ「You
    are already at the bottom of the page...」を表示しなければならない（SHALL）。
- rule_id: bfcaadd0_6034_44a5_a822_be977e0d214d
  program: COPAUS0C
  disposition: not_applicable
  reason: '[Pattern-classified] CICS/BMSプラットフォーム機構'
  program_path: demo/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl
  rule_name: プログラム状態を初期化し、初期画面を表示する
  rule_text: Authorization List Displayは、エラーフラグ（`WS-ERR-FLG`）、承認ファイル終端フラグ（`WS-AUTHS-EOF`）、および画面消去フラグ（`WS-SEND-ERASE-FLG`）をそれぞれのデフォルト状態に初期化しなければならない（SHALL）。出力画面バッファをクリアしなければならない（SHALL）。アカウントID入力フィールドの長さを-1に設定しなければならない（SHALL）。初期承認リスト画面を表示しなければならない（SHALL）。
- rule_id: c711f514_081e_44bf_8e84_db3503278192
  program: COPAUS0C
