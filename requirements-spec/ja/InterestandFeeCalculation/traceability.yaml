  rule_name: 月次利息を計算し、取引を書き込む
  rule_text: '取引カテゴリに対して非ゼロの利率が見つかった場合、THE 利息取引生成部 SHALL 月次利息を(取引カテゴリバランス × 利率) ÷
    1200として計算する。計算された利息を合計利息アキュムレータに加算する。パラメータ日付から構築された取引IDと増分されるサフィックスカウンター、取引タイプ''01''、取引カテゴリ''05''、ソース''System''、説明''Int.
    for a/c ''に口座IDを付加したもの、計算された月次利息に設定された金額、クリアされた加盟店フィールド、カードクロスリファレンスからのカード番号、およびDB2形式の現在の日付と時刻に設定されたタイムスタンプを持つ利息取引レコードを作成する。取引レコードを取引ファイルに書き込む。(物理ストア:
    `TRANSACT-FILE`)'
