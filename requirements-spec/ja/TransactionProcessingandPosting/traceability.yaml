  rule_name: 業務ルールに基づく取引の検証
  rule_text: '取引レコードが検証可能な状態になったとき(WHEN)、取引検証エンジンは、カード相関参照ファイルでカード番号を検索しなければならない(SHALL)。見つからない場合は検証失敗理由を100に設定する。見つかった場合は、口座マスターファイルで口座を検索する。見つからない場合は検証失敗理由を101に設定する。見つかった場合は、現サイクルクレジットから現サイクルデビットを引き取引金額を加えた値を仮残高として計算する。仮残高がクレジット限度額を超える場合は検証失敗理由を102に設定する。口座有効期限が取引日より前の場合は検証失敗理由を103に設定する。それ以外の場合は、検証失敗理由0で検証は成功する。(物理ストア:
