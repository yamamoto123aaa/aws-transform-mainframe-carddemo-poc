  rule_text: ユーザーがPF3（終了）を押下したとき、Exit Routerは通信領域から宛先トランザクションおよびプログラムを判定しなければならない（存在する場合は起点トランザクション識別子および起点プログラム名を使用し、存在しない場合はメニュートランザクション識別子（`LIT-MENUTRANID`）およびメニュープログラム名（`LIT-MENUPGM`）をデフォルトとする）。現在のプログラム（`LIT-THISPGM`）およびトランザクション（`LIT-THISTRANID`）を起点として記録するよう通信領域を更新し、ユーザータイプを一般ユーザーに設定し、プログラムコンテキストを初期エントリに設定し、現在のマップセット（`LIT-THISMAPSET`）およびマップ（`LIT-THISMAP`）を最終アクセスとして記録しなければならない。更新された通信領域を伴って宛先プログラムへ制御を渡さなければならない。
