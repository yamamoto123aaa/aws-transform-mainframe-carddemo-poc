  rule_name: カードが表示対象として選択された場合にカード詳細プログラムへ制御を移す
  rule_text: WHEN ユーザーがENTERを押下し、選択された項目インデックス(`I-SELECTED`)のカード行が表示対象としてマーク(選択フラグ(`WS-EDIT-SELECT`)が'S')され、発信元プログラム(`CDEMO-FROM-PROGRAM`)が現在のプログラム(`LIT-THISPGM`)である場合、THE
    Credit Card Detail Navigation SHALL 通信領域に現在のトランザクションID(`LIT-THISTRANID`)、現在のプログラム名(`LIT-THISPGM`)、ユーザー種別を一般ユーザーとして、プログラムコンテキストを初期入力として、現在のマップセット(`LIT-THISMAPSET`)およびマップ名(`LIT-THISMAP`)、選択されたインデックスの画面行から選択されたカードの口座番号とカード番号を設定し、次のプログラムをカード詳細プログラム(`LIT-CARDDTLPGM`)に設定し、XCTLによりそのプログラムへ制御を移す
