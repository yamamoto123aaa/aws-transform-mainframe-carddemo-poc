  rule_text: トランザクションタイプフィルタの検証が失敗した場合、または削除操作が失敗した場合、Screen Attribute Setup はエラー状態を示すためにトランザクションタイプコードフィールド(`TRTYPCDC`)を赤色で表示しなければならない。
