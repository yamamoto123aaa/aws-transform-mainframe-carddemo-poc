  rule_text: 画面が表示のために準備されているとき(WHEN)、画面属性ハンドラは、検証が失敗した場合またはフィールドが空白の場合にカーソルをアカウント識別子フィールドに位置指定し、検証失敗時にアカウント識別子フィールドの色を赤に設定し、再入力時にフィールドが空白の場合は赤色でワイルドカードのプレースホルダーを表示し、メッセージの有無に基づいて情報メッセージフィールドの色を設定しなければならない(SHALL)。
