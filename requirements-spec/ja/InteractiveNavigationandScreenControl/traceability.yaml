  rule_text: プログラムが再入力モードである間、トランザクションタイプフィルタフィールドが空白の場合、Screen Attribute Setup は必須の空白フィールドを示すためにトランザクションタイプコードフィールドにアスタリスクを表示し、赤色に着色しなければならない。
