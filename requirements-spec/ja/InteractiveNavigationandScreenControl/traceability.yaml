  program_path: demo/cbl/CORPT00C.cbl
  rule_name: 画面ヘッダー情報の設定
  rule_text: 画面ヘッダー設定機能は、現在の日付および時刻を取得し、事前定義済みのタイトル行を画面出力フィールドへ移動し、トランザクション識別子をトランザクション名出力フィールドへ移動し、プログラム名をプログラム名出力フィールドへ移動し、現在の日付をMM/DD/YY形式に整形して現在日付出力フィールドへ移動し、現在の時刻をHH:MM:SS形式に整形して現在時刻出力フィールドへ移動しなければならない。
