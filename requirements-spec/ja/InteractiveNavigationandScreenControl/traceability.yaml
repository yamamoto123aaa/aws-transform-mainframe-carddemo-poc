  program: COTRTUPC
  disposition: captured
  program_path: demo/app-transaction-type-db2/cbl/COTRTUPC.cbl
  rule_name: 代替キーおよびコンテキスト分岐を評価する
  rule_text: プログラムが端末入力キーを取得し、それをキー指示子にマッピングしている間、押されたキーとアプリケーションコンテキストが評価対象の条件のいずれかと一致する場合、トランザクションタイプ更新プログラムは押されたキーとアプリケーションコンテキストを評価しなければならない。管理プログラムからの再入場でない場合は管理プログラムのロジックを実行し、リストプログラムからの再入場でない場合はリストプログラムのロジックを実行し、初回入場で詳細が未取得の場合は詳細取得を実行し、PF4が押され削除確認または詳細表示状態の場合は更新または削除を実行し、PF5が押され未検出または未確認変更状態の場合は検証または確認を実行し、PF12が押され確認、詳細、または削除状態の場合はキャンセルまたはリセットを実行し、無効なキーが押された場合はエラーを処理し、その他の組み合わせについてはデフォルト処理を実行する。
  req_ids:
  - REQ-F-1430
  - REQ-F-1472
  traceability_lines:
  - 556
