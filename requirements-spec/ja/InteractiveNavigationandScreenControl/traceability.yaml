  rule_name: トランザクションタイプ説明フィールドにカーソルを位置付ける
  rule_text: 処理状態がトランザクションタイプ説明フィールドへのカーソル位置付けを要求する場合、またはコードフィールドへのデフォルト位置付けとなる場合、Screen
    Attribute Setup は適切な場合にその長さを-1に設定してトランザクションタイプ説明フィールド(`TRTYDSCL`)にカーソルを位置付けなければならない。そうでない場合はトランザクションタイプコードフィールドに位置付ける。
