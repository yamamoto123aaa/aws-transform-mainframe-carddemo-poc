  rule_text: WHEN ユーザーがPF3(終了)を押下し、発信元プログラムが現在のプログラムである場合、THE Menu Navigation Handler
    SHALL 通信領域に現在のトランザクション識別子、プログラム名、ユーザー種別、ナビゲーションコンテキストを設定し、遷移先プログラムをメニュープログラムに設定し、通信領域を渡してXCTLによりメニュープログラムへ制御を移す。
