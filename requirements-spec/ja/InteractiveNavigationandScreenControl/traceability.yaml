  rule_name: プログラムを初期化し、トランザクション処理の準備を行う
  rule_text: Transaction Type Maintenance はワークエリアおよび通信エリアを初期化しなければならない。呼び出し元データが存在しない場合、または呼び出し元が初回エントリ時の管理プログラムもしくは一覧プログラムである場合、すべてのトランザクション詳細をクリアし、プログラムを初期エントリモードに設定しなければならない。そうでない場合は呼び出し元の保存された通信エリアデータを復元しなければならない
