  reason: '[Pattern-classified] CICS/BMSプラットフォーム機構'
  program_path: demo/app-transaction-type-db2/cbl/COTRTUPC.cbl
  rule_name: 取引種別保守画面を端末に送信する
  rule_text: 画面センダーは、次のマップセット名とマップ名を設定しなければならない。カーソル位置指定、画面消去、キーボードアンロックを伴って取引種別保守画面を端末に送信し、応答コードをキャプチャする。
- rule_id: ed0dc7ce_cc62_4310_82c7_8ee6134632c3
  program: COTRTUPC
  disposition: not_applicable
  reason: '[Pattern-classified] CICS/BMSプラットフォーム機構'
  program_path: demo/app-transaction-type-db2/cbl/COTRTUPC.cbl
  rule_name: 終了時に呼び出し元プログラムまたは管理メニューへ遷移する
  rule_text: ユーザーがPF3(終了キー)を押下するとき、取引種別更新プログラムは、遷移先プログラムおよびトランザクションIDを決定しなければならない。呼び出し元のトランザクションIDが空欄またはスペースの場合は、管理トランザクション(`LIT-ADMINTRANID`)および管理プログラム(`LIT-ADMINPGM`)へ遷移する。それ以外の場合は、呼び出し元のトランザクションIDおよびプログラム名へ遷移する。現在のプログラムコンテキストを初期エントリに設定し、ユーザーを管理者としてマークし、現在のマップ名およびマップセット名を記録し、通信領域を伴ってXCTLにより遷移先プログラムへ制御を移す。
