  rule_name: 状態に基づいてファンクションキーフィールド属性を設定する
  rule_text: 画面が表示準備される間、Function Key Attribute Manager は現在の状態に基づいてファンクションキーインジケータを明るく(有効)または暗く(無効)設定しなければならない。ENTERは削除確認中は暗くなる。F4は詳細表示中または削除確認中は明るくなる。F5は変更保留中または詳細が見つからない場合は明るくなる。F12は変更保留中、詳細表示中、詳細が見つからない場合、削除確認中、または新規レコード作成中は明るくなる。
