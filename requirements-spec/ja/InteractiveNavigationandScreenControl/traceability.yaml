  rule_name: 更新された顧客レコードを組み立てて書き込む
  rule_text: 顧客更新レコードがデータストアへの書き込み準備が完了した場合、顧客レコード更新は、変更された顧客ID（`CUST-UPDATE-ID`）、名前フィールド（`CUST-UPDATE-FIRST-NAME`、`CUST-UPDATE-MIDDLE-NAME`、`CUST-UPDATE-LAST-NAME`）、住所フィールド（`CUST-UPDATE-ADDR-LINE-1`、`CUST-UPDATE-ADDR-LINE-2`、`CUST-UPDATE-ADDR-LINE-3`、`CUST-UPDATE-ADDR-STATE-CD`、`CUST-UPDATE-ADDR-COUNTRY-CD`、`CUST-UPDATE-ADDR-ZIP`）、電話番号、社会保障番号（`CUST-UPDATE-SSN`）、政府発行ID（`CUST-UPDATE-GOVT-ISSUED-ID`）、EFTアカウントID（`CUST-UPDATE-EFT-ACCOUNT-ID`）、プライマリカード指標（`CUST-UPDATE-PRI-CARD-IND`）、およびFICOスコア（`CUST-UPDATE-FICO-CREDIT-SCORE`）をコピーして顧客更新レコードを組み立てなければならない。電話番号を(AAA)EEE-LLLL形式で、生年月日をYYYY-MM-DD形式で再構成すること。組み立てたレコードを顧客データストア（`LIT-CUSTFILENAME`）に書き込むこと。書き込みが成功した場合は続行すること。書き込みが失敗した場合は更新失敗フラグをtrueに設定し、アカウント更新を取り消すためにROLLBACKを発行すること
