  program_path: demo/cbl/CORPT00C.cbl
  rule_name: トランザクションレポート画面の準備および表示
  rule_text: トランザクションレポート画面を表示する場合、トランザクションレポート画面送信機能は、画面ヘッダー情報を設定し、メッセージテキストをエラーメッセージ出力フィールドへ移動し、画面をユーザーへ送信しなければならない。画面消去フラグが設定されている場合は送信前に表示を消去し、そうでない場合は既存の内容を保持する。
