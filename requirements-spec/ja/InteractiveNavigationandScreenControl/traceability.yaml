  reason: '[Pattern-classified] 画面フィールドの設定'
  program_path: demo/cbl/COCRDLIC.cbl
  rule_name: 表示用のエラーメッセージおよび情報メッセージの組み立て
  rule_text: THE Message composition and display SHALL 現在の状態を評価し、適切なエラーメッセージまたは情報メッセージを設定する。最初のページでページアップが試行された場合は「NO
    PREVIOUS PAGES TO DISPLAY」を設定し、最後のページが表示されている状態で最後のページでページダウンが試行された場合は「NO MORE
    PAGES TO DISPLAY」を設定し、最後のページが表示されていない状態で最後のページでページダウンが試行された場合は案内メッセージを設定し、次のページが存在しメッセージが未設定の場合は案内メッセージを設定する。エラーメッセージを出力マップへ移動し、情報メッセージが設定されておりレコードが見つかった場合は情報メッセージを中間色で出力マップへ移動する。
