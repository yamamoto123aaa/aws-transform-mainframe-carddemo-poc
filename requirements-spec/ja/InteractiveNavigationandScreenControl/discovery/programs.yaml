- name: COADM01C
  type: COBOL
  execution: subroutine
  description: Administrator menu option selection and navigation; The program receives
    the administrator menu screen input, validates the user's selected option number,
    and transfers control to the corresponding administrator function program. The
    validation ensures the option is numeric, within the valid range (1-6), and not
    a placeholder entry. When validation succeeds and the selected program is not
    a dummy entry, the program transfers control to that program via XCTL, passing
    the communication area containing the originating transaction and program context.;
    Signon screen navigation control; The program handles terminal input and navigation
    logic for a card demonstration application. When the communication area is empty,
    the program immediately transfers control to the signon screen. When the communication
    area contains data and the user presses PF3, the program sets the destination
    to the signon screen program and transfers control. If the destination program
    name is not set or contains invalid values, the program defaults it to the signon
    screen before transferring control.; Administration menu screen display; This
    capability drives the CardDemo administration menu screen, presenting up to six
    numbered menu options to the user along with header information (title, date,
    time, transaction, and program identifiers). On first entry the menu is displayed
    immediately; on re-entry the user's key press is evaluated — the Enter key triggers
    option validation and navigation, PF3 exits, and any other key causes an invalid-key
    error message to be shown. If a referenced option program is not installed, a
    'not installed' message is displayed instead of navigating.
  calls:
  - COSGN00C
  - Unresolved dynamic call to CDEMO-ADMIN-OPT-PGMNAME
- name: COCRDSLC
  type: COBOL
  execution: subroutine
  description: Credit card transaction routing and function key handling; The program
    initializes the credit card work area and communication context, maps user keyboard
    input (function keys and control keys) to internal action codes, validates the
    input against allowed actions, and routes the transaction to the appropriate destination
    program based on the user's selection. When the user presses PF3 (exit), the program
    determines the target program and transaction from the communication area or defaults
    to the menu, then transfers control to that destination with the updated context.;
    Card inquiry and display screen; The program manages a card inquiry transaction
    that displays cardholder information on a 3270 terminal screen. It initializes
    the display with current date/time and application titles, populates card details
    when available, applies visual attributes (colors, protection) based on validation
    state, and sends the formatted screen to the user. The screen supports user input
    for account and card number searches, with error messages displayed when validation
    fails or records are not found.
  data_stores_read: *id001
  calls:
  - COMEN01C
- name: COCRDUPC
  type: COBOL
  execution: subroutine
  description: Card update program navigation and control transfer; This program receives
    card update requests through a communication area, validates user input via function
    key mapping, and routes control to the appropriate destination program based on
    the user's action and current processing state. The primary business outcome is
    transferring control to either the originating program, the main menu, or a specialized
    card-processing handler, with the communication area carrying account, card, and
    navigation context across program boundaries.; Credit card update transaction
    processing; This program manages the interactive update of credit card details
    through a terminal screen interface. It receives user input for card information
    changes, validates the input against business rules, retrieves the current card
    record from the card data store, compares old and new values to detect changes,
    and writes the updated card record back to the store when changes are confirmed.
    The program displays the card update screen with appropriate field protections
    and error messages based on the validation state and user actions.
  data_stores_read: *id002
  data_stores_write:
  - AWS.M2.CARDDEMO.CARDDATA.VSAM.KSDS
  calls:
  - COMEN01C
- name: COMEN01C
  type: COBOL
  execution: subroutine
  description: Menu option selection and program transfer; The program receives a
    menu screen input from the user, validates the selected option against available
    menu choices and user authorization, and transfers control to the corresponding
    target program via XCTL. The validation ensures the option is numeric, within
    the valid range, and authorized for the user type. When validation succeeds and
    the target program is available, the program transfers control with the communication
    area containing the originating transaction and program context.; Menu option
    selection and program transfer; The program receives a menu screen input from
    the user, validates the selected option against available menu choices and user
    authorization, and transfers control to the corresponding target program via CICS
    XCTL. The validation ensures the option is numeric, within the valid range, and
    authorized for the user type; invalid selections trigger an error flag. The communication
    area is populated with originating transaction and program context before the
    transfer.; Card demonstration application navigation control; The program receives
    a communication area from CICS, validates the reentry context, and routes user
    navigation based on function key input. When the PF3 key is pressed, the program
    sets the destination to the sign-on screen and transfers control. If no destination
    is set or the destination is empty, the program defaults to the sign-on screen
    before transferring control to the target program.; Menu screen display and option
    selection; The program manages a CardDemo menu interface, displaying transaction
    information, menu options, and error messages to the user. When the program is
    first invoked, it displays the menu screen with header information and available
    options. When the user re-enters after selecting an option, the program receives
    the user's menu selection, validates it against business rules (numeric range,
    user authorization), and either displays an error message or processes the selected
    option. The final output is the menu screen sent to the terminal with all populated
    fields.
  shared_with:
  - AuthorizationManagement
  - Unclassified
  note: '[SHARED-SUBROUTINE: COMEN01C — also called by AuthorizationManagement, Unclassified]'
  calls:
  - COSGN00C
  - Unresolved dynamic call to CDEMO-MENU-OPT-PGMNAME
- name: COSGN00C
  type: COBOL
  execution: subroutine
  description: Signon screen display and user authentication; The program displays
    a signon screen to collect user credentials, validates the entered user ID and
    password against a security file, and redisplays the screen with appropriate error
    messages when validation fails. The screen is populated with current date, time,
    application identifiers, and transaction information on each display.; Sign-on
    authentication and user session routing; The program implements a sign-on flow
    that collects user credentials from a screen, validates them against a security
    file, and routes authenticated users to either an administrator or general menu
    based on their user type. The program receives input via the Enter key, validates
    that both user ID and password are provided, retrieves the user's security record,
    verifies the password, and transfers control to the appropriate downstream application
    with the authenticated user's context.
- name: COTRN00C
  type: COBOL
  execution: subroutine
  description: Transaction selection and navigation handler; The program receives
    a transaction list screen from the user, evaluates which transaction option was
    selected, and transfers control to the appropriate destination program when a
    valid selection is made. The program manages program re-entry state and passes
    transaction context through a shared communication area.; Screen navigation and
    program transfer; The program handles user navigation through function-key inputs
    and manages transitions between screens. When the communication area is empty,
    it defaults to the signon screen. When re-entering with a function key, it evaluates
    the key pressed and routes to the appropriate destination program, populating
    the communication area with navigation context before transferring control.; Transaction
    list display and navigation; The program manages a paginated transaction list
    display on a 3270 terminal screen. It handles user input (ENTER, PF7, PF8 keys)
    to navigate forward and backward through transaction records, retrieves transaction
    data from the transaction file, populates the screen with up to 10 transactions
    per page, and sends the formatted display to the user. Error conditions during
    file access or invalid user input are captured and displayed as error messages
    on the screen.
  data_stores_read: *id003
  calls:
  - COMEN01C
  - COSGN00C
  - COTRN01C
- name: COTRN01C
  type: COBOL
  execution: subroutine
  description: Transaction navigation and screen routing; The program handles user
    navigation through a card demonstration application by evaluating function key
    inputs and routing control to the appropriate destination program. When the communication
    area is empty, it routes to the sign-on program. When re-entering with a valid
    context, it evaluates the pressed function key (Enter, PF3, PF4, PF5) and routes
    to the corresponding destination program (menu, previous program, or transaction
    main). The destination program name is validated and defaulted to sign-on if missing,
    then control is transferred with the communication area context.; Transaction
    view screen display and input handling; The program manages a transaction inquiry
    screen (COTRN1A) that displays transaction details and merchant information. It
    initializes the screen on first entry, receives user input on subsequent entries,
    validates the transaction ID, retrieves the matching transaction record, and displays
    the results or error messages. The screen is sent to the user after populating
    header information (current date, time, program name, and titles) and either transaction
    details or validation error messages.
  data_stores_read: *id004
  calls:
  - COMEN01C
  - COSGN00C
  - COTRN00C
- name: COTRTUPC
  type: COBOL
  execution: subroutine
  description: Transaction type update screen navigation; The program initializes
    working storage and communication areas, captures the user's terminal input key,
    and routes control to the appropriate destination program based on the key pressed
    and application context. When the user presses PF3 (exit), the program prepares
    the communication area with routing information and transfers control to the calling
    program or administration menu.; Transaction type maintenance screen display;
    The program prepares and displays a transaction type maintenance screen to the
    user. It initializes screen fields with current date/time, transaction type details,
    and informational messages based on the current processing state. The screen is
    formatted with appropriate field protections, colors, and function key indicators
    before being sent to the terminal.; Transaction type database update and insert;
    The program initializes working storage and communication areas, maps terminal
    attention keys to internal flags, and evaluates business conditions to determine
    whether to update or insert transaction type records in the transaction type database.
    When the user presses PFK05 while changes are pending confirmation, the program
    updates the existing transaction type record; if no matching record exists (SQL
    code +100), it inserts a new transaction type record instead.; Transaction type
    deletion from database; The program initializes working storage and communication
    areas, maps keyboard input to function keys, and evaluates user actions. When
    the user presses PF4 while confirming a delete operation, the program retrieves
    the original transaction type code and deletes the corresponding record from the
    transaction type database store.
  data_stores_write:
  - CARDDEMO.TRANSACTION_TYPE
  calls:
  - COADM01C
