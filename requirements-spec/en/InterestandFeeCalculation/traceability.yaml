  program_path: demo/cbl/CBACT04C.cbl
  rule_name: Compute monthly interest and write transaction
  rule_text: 'WHEN a non-zero interest rate is found for the transaction category,
    THE Interest Transaction Generator SHALL compute monthly interest as (transaction
    category balance × interest rate) ÷ 1200; add the computed interest to the total
    interest accumulator; create an interest transaction record with transaction ID
    constructed from the parameter date and an incremented suffix counter, transaction
    type ''01'', transaction category ''05'', source ''System'', description ''Int.
    for a/c '' plus account ID, amount set to the computed monthly interest, merchant
    fields cleared, card number from the card cross-reference, and timestamps set
    to the current date and time in DB2 format; write the transaction record to the
    transaction file. (physical store: `TRANSACT-FILE`)'
