  rule_name: Initialize processing loop and read transaction category records
  rule_text: WHILE transaction category balance records remain available, THE Transaction
    Category Balance Processor SHALL read each transaction category balance record
    sequentially; when a new account is detected, update the prior account's balance
    with accumulated interest and reset the accumulator; retrieve the account record,
    card cross-reference, and applicable interest rate; if the interest rate is non-zero,
    compute monthly interest and write an interest transaction; continue until end
    of file.
