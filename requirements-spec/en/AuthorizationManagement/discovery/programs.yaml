- name: COSGN00C
  type: COBOL
  execution: subroutine
  description: Signon screen display and user authentication; The program displays
    a signon screen to collect user credentials, validates the entered user ID and
    password against a security file, and redisplays the screen with appropriate error
    messages when validation fails. The screen is populated with current date, time,
    application identifiers, and transaction information on each display.; Sign-on
    authentication and user session routing; The program implements a sign-on flow
    that collects user credentials from a screen, validates them against a security
    file, and routes authenticated users to either an administrator or general menu
    based on their user type. The program receives input via the Enter key, validates
    that both user ID and password are provided, retrieves the user's security record,
    verifies the password, and transfers control to the appropriate downstream application
    with the authenticated user's context.
