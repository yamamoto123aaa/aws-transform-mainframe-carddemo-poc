- name: COMEN01C
  type: COBOL
  execution: subroutine
  description: Menu option selection and program transfer; The program receives a
    menu screen input from the user, validates the selected option against available
    menu choices and user authorization, and transfers control to the corresponding
    target program via XCTL. The validation ensures the option is numeric, within
    the valid range, and authorized for the user type. When validation succeeds and
    the target program is available, the program transfers control with the communication
    area containing the originating transaction and program context.; Menu option
    selection and program transfer; The program receives a menu screen input from
    the user, validates the selected option against available menu choices and user
    authorization, and transfers control to the corresponding target program via CICS
    XCTL. The validation ensures the option is numeric, within the valid range, and
    authorized for the user type; invalid selections trigger an error flag. The communication
    area is populated with originating transaction and program context before the
    transfer.; Card demonstration application navigation control; The program receives
    a communication area from CICS, validates the reentry context, and routes user
    navigation based on function key input. When the PF3 key is pressed, the program
    sets the destination to the sign-on screen and transfers control. If no destination
    is set or the destination is empty, the program defaults to the sign-on screen
    before transferring control to the target program.; Menu screen display and option
    selection; The program manages a CardDemo menu interface, displaying transaction
    information, menu options, and error messages to the user. When the program is
    first invoked, it displays the menu screen with header information and available
    options. When the user re-enters after selecting an option, the program receives
    the user's menu selection, validates it against business rules (numeric range,
    user authorization), and either displays an error message or processes the selected
    option. The final output is the menu screen sent to the terminal with all populated
    fields.
  shared_with:
  - InteractiveNavigationandScreenControl
  - Unclassified
  note: '[SHARED-SUBROUTINE: COMEN01C — also called by InteractiveNavigationandScreenControl,
    Unclassified]'
