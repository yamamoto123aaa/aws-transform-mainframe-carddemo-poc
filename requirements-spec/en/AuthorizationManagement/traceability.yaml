  rule_name: Retrieve card cross-reference record by account
  rule_text: WHEN the card cross-reference record needs to be retrieved by account
    ID, THE Card Cross-Reference Retriever SHALL move the account ID (`WS-ACCT-ID`)
    to the card record identifier field; execute a CICS READ command to retrieve the
    card cross-reference record from the card cross-reference store (`WS-CARDXREFNAME-ACCT-PATH`)
    using the account ID as the key; evaluate the CICS response code; if the response
    code indicates success (NORMAL), the card cross-reference record is successfully
    retrieved; if the response code indicates not found (NOTFND), construct an error
    message indicating that the account was not found in the cross-reference store,
    set the account ID input field length to -1, and display the screen with the error
    message; if the response code indicates any other error, construct an error message
    describing the system error and the response and reason codes, set the account
    ID input field length to -1, and display the screen with the error message.
