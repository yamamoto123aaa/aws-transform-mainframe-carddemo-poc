  program: CBPAUP0C
  disposition: captured
  program_path: demo/app-authorization-ims-db2-mq/cbl/CBPAUP0C.cbl
  rule_name: Evaluate authorization expiry and update summary totals
  rule_text: WHEN an authorization detail record is retrieved and ready for expiry
    evaluation, THE Authorization Expiry Evaluation SHALL calculate the authorization
    age by inverting the stored date and comparing it to the current date; when the
    age exceeds the expiry threshold and the response code is '00', decrement the
    approved count and approved amount; when the age exceeds the threshold and the
    response code is not '00', decrement the declined count and declined amount; when
    the age does not exceed the threshold, mark the authorization as not qualified
    for deletion.
