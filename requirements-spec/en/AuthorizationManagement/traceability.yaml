- rule_id: 00455550_a5fd_446f_a0f3_54ad03294723
  program: COPAUS0C
  disposition: not_applicable
  reason: '[Pattern-classified] CICS/BMS platform mechanics'
  program_path: demo/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl
  rule_name: Process PF7 key for previous page navigation
  rule_text: WHEN the user presses the PF7 key to navigate to the previous page, THE
    Previous Page Navigator SHALL check if the current page number (`CDEMO-CPVS-PAGE-NUM`)
    is greater than 1; if yes, decrement the page number, retrieve the saved authorization
    key for the previous page from the communication area (`CDEMO-CPVS-PAUKEY-PREV-PG`),
    call the authorization summary retrieval routine to fetch the authorization summary
    starting from that key, set the screen erase flag (`WS-SEND-ERASE-FLG`) to 'N',
    initialize the authorization list display fields, and populate the authorization
    list with the previous page of records; if no (already at page 1), display error
    message 'You are already at the top of the page...' and set the screen erase flag
    to 'N'.
- rule_id: 29ac8b77_84e1_412d_aac0_cc747349f023
  program: COPAUS0C
  disposition: not_applicable
  reason: '[Pattern-classified] CICS/BMS platform mechanics'
  program_path: demo/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl
  rule_name: Display authorization list screen
  rule_text: WHEN the authorization list screen needs to be displayed to the user,
    THE Screen Display Handler SHALL call the header information population routine
    to populate the screen header fields; move the message text to the error message
    output field; check the screen erase flag (`WS-SEND-ERASE-FLG`); if the flag is
    set to 'Y', send the screen with the ERASE option to clear the screen before displaying;
    if the flag is set to 'N', send the screen without the ERASE option to preserve
    existing screen content.
- rule_id: 64ec20d9_9410_4e9c_a08e_51efdd150756
  program: COPAUS0C
  disposition: not_applicable
  reason: '[Pattern-classified] CICS/BMS platform mechanics'
  program_path: demo/app-authorization-ims-db2-mq/cbl/COPAUS0C.cbl
  rule_name: Process PF8 key for next page navigation
  rule_text: WHEN the user presses the PF8 key to navigate to the next page, THE Next
    Page Navigator SHALL check if a last authorization key (`CDEMO-CPVS-PAUKEY-LAST`)
    is present in the communication area; if yes, store that key as the starting point,
    call the authorization summary retrieval routine to fetch the authorization summary
    starting from that key, and call the authorization repositioning routine to position
    the cursor at that key; set the account ID input field length to -1 and the screen
    erase flag (`WS-SEND-ERASE-FLG`) to 'N'; check if the next page flag (`CDEMO-CPVS-NEXT-PAGE-FLG`)
    is set to 'Y'; if yes, initialize the authorization list display fields and populate
    the authorization list with the next page of records; if no (already at the bottom),
    display error message 'You are already at the bottom of the page...'.
