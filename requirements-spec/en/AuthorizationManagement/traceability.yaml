  rule_text: WHEN the program is entered for the first time (program reentry context
    is not set), THE Account Details Retrieval SHALL clear the output screen buffer;
    call the account details gathering routine to retrieve customer name, address,
    phone, account limits, and authorization summaries; set the screen erase flag
