  rule_name: Retrieve authorization summary from database
  rule_text: 'WHEN the authorization summary needs to be retrieved from the database,
    THE Authorization Summary Retriever SHALL call the PSB scheduling routine to ensure
    the IMS program control block is properly scheduled; move the account ID from
    the communication area to the pending authorization summary record; execute a
    DLI GU operation to retrieve the authorization summary record from the pending
    authorization summary database using the account ID as the search key; check the
    IMS return code; if the return code indicates success (STATUS-OK), set the pending
    authorization summary segment found flag (`WS-PAUT-SMRY-SEG-FLG`) to ''Y''; if
    the return code indicates segment not found (SEGMENT-NOT-FOUND), set the pending
    authorization summary segment found flag to ''N''; if the return code indicates
    any other error, set the error flag (`WS-ERR-FLG`) to ''Y'', construct an error
    message describing the system error and the error code, set the account ID input
    field length to -1, and display the screen with the error message. (physical store:
    `DLI:GU`)'
