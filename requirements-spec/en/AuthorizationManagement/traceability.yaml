    ID as key, compare the stored password with the entered password when the read
    succeeds, display 'Wrong Password. Try again ...' and redisplay the screen if
    passwords do not match, display 'User not found. Try again ...' and redisplay
    the screen if the user ID is not found, and display 'Unable to verify the User
    ...' and redisplay the screen if a system error occurs during the read.
