- rule_id: 2dc21a03_0fd1_41cc_95e5_c529c2153c87
  program: COSGN00C
  disposition: captured
  program_path: demo/cbl/COSGN00C.cbl
  rule_name: Authenticate user against security file
  rule_text: WHEN the user ID and password have been collected and validated as non-empty,
    THE User authentication and session routing SHALL read the user security file
    (`WS-USRSEC-FILE`) using the user ID as key; if the read succeeds and the retrieved
    password matches the entered password, populate the communication area with the
    user's transaction ID, program name, user ID, and user type, and transfer control
    to the administrator menu program if the user type is administrator, or to the
    general menu program otherwise; if the read fails with not-found or any other
    error, invoke the appropriate error-handling branch.
  req_id: REQ-F-081
