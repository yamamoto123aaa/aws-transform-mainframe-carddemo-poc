- rule_id: 12d11e9c_ae4a_4f4b_b39b_734578bc1434
  program: COPAUS0C
  disposition: captured
  rule_name: Populate authorization list on screen
  rule_text: WHILE no error flag is set and authorization records are available, THE
    Authorization List Populator SHALL initialize the index counter (`WS-IDX`) to
    1; enter a loop that continues until the index counter exceeds 5, the end-of-file
    flag (`WS-AUTHS-EOF`) is set, or an error flag (`WS-ERR-FLG`) is set; for each
    iteration, check if the PF7 key was pressed and the index counter is 1; if yes,
    call the authorization repositioning routine to position the cursor at the saved
    authorization key; otherwise, call the authorization retrieval routine to fetch
    the next authorization record; if an authorization record is successfully retrieved
    and no error flag is set, call the authorization list population routine to populate
    the screen fields for that authorization and increment the index counter; after
    the loop completes, if more authorizations are available and no error flag is
    set, call the authorization retrieval routine one more time to check whether a
    next page exists.
