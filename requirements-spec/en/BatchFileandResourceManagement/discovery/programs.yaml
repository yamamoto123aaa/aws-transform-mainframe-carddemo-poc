programs:
- name: CARDFILE
  type: JCL
  execution: batch
  description: 'Close CICS region files for batch access; This job step invokes the
    SDSF operator command interface to close specific files in the CICS region, enabling
    exclusive batch processing. The step reads CEMT (CICS master terminal) commands
    from inline data, directing the CICS region to close the CARDDAT and CARDAIX files.
    Output from the command execution is routed to standard output for operator visibility.;
    Alternate index lifecycle management; This batch job manages the alternate index
    for the card data store. It first removes any existing alternate index to ensure
    a clean state, then defines a new alternate index keyed on the account ID field
    (bytes 11–16) with non-unique key support and automatic upgrade capability. The
    alternate index enables efficient lookups and range scans on account ID without
    requiring sequential access to the primary key-sequenced dataset.; Alternate index
    path definition; The job defines a path that relates an alternate index to its
    base cluster, enabling indexed access to card data through the alternate index.
    The DEFINE PATH operation establishes the logical connection between the alternate
    index (AWS.M2.CARDDEMO.CARDDATA.VSAM.AIX) and its path name (AWS.M2.CARDDEMO.CARDDATA.VSAM.AIX.PATH),
    allowing applications to query card records through this alternate key.; Card
    data store initialization and indexing; This job prepares a card data store by
    removing any existing instance, creating a new indexed store with specific capacity
    and key characteristics, populating it from a source file, and building an alternate
    index for efficient lookups. The job executes three sequential steps: deletion
    of the prior store (if present), creation of a new indexed store with 16-byte
    keys and 150-byte records, and population of the store from a flat-file source
    followed by index construction.; CICS file open operation; The job step invokes
    the system operator interface to open two CICS files for exclusive batch access.
    The step reads operator commands from inline data, directing the CICS region to
    open the card data file and its associated index file, enabling batch processing
    to proceed with file access.'
