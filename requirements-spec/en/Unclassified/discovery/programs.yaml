- name: COADM01C
  type: COBOL
  execution: subroutine
  description: Administrator menu option selection and navigation; The program receives
    the administrator menu screen input, validates the user's selected option number,
    and transfers control to the corresponding administrator function program. The
    validation ensures the option is numeric, within the valid range (1-6), and not
    a placeholder entry. When validation succeeds and the selected program is not
    a dummy entry, the program transfers control to that program via XCTL, passing
    the communication area containing the originating transaction and program context.;
    Signon screen navigation control; The program handles terminal input and navigation
    logic for a card demonstration application. When the communication area is empty,
    the program immediately transfers control to the signon screen. When the communication
    area contains data and the user presses PF3, the program sets the destination
    to the signon screen program and transfers control. If the destination program
    name is not set or contains invalid values, the program defaults it to the signon
    screen before transferring control.; Administration menu screen display; This
    capability drives the CardDemo administration menu screen, presenting up to six
    numbered menu options to the user along with header information (title, date,
    time, transaction, and program identifiers). On first entry the menu is displayed
    immediately; on re-entry the user's key press is evaluated — the Enter key triggers
    option validation and navigation, PF3 exits, and any other key causes an invalid-key
    error message to be shown. If a referenced option program is not installed, a
    'not installed' message is displayed instead of navigating.
