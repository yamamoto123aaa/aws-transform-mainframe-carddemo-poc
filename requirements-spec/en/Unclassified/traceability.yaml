  reason: '[Pattern-classified] Data formatting for display'
  program_path: demo/cbl/COADM01C.cbl
  rule_name: Populate administration menu screen header
  rule_text: THE Administration Menu Header Populator SHALL retrieve the current date
    and time, format the date as MM/DD/YY into the current date output (`CURDATEO`)
    and the time as HH:MM:SS into the current time output (`CURTIMEO`), and populate
    the title lines (`TITLE01O`, `TITLE02O`), transaction identifier (`TRNNAMEO`),
    and program name (`PGMNAMEO`) on the administration menu screen
- rule_id: 6c43f75a_9488_47cb_b772_545fd5393657
  program: COADM01C
  disposition: not_applicable
  reason: '[Pattern-classified] Data formatting for display'
  program_path: demo/cbl/COADM01C.cbl
  rule_name: Build administration menu option display lines
  rule_text: WHILE administration menu options remain to be placed on the screen (index
    does not exceed the admin option count (`CDEMO-ADMIN-OPT-COUNT`)), THE Administration
    Menu Option Builder SHALL format each option's number and name into a display
    string (`WS-ADMIN-OPT-TXT`) and assign it to the corresponding numbered option
    output field (`OPTN001O` through `OPTN010O`) on the administration menu screen
