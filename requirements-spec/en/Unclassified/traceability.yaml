    (`WS-USRSEC-FILE`) using the user ID as key; if the read succeeds and the retrieved
    password matches the entered password, populate the communication area with the
    user's transaction ID, program name, user ID, and user type, and transfer control
    to the administrator menu program if the user type is administrator, or to the
    general menu program otherwise; if the read fails with not-found or any other
