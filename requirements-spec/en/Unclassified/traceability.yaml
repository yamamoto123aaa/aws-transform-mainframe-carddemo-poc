  program: COADM01C
  disposition: not_applicable
  reason: '[Pattern-classified] CICS/BMS platform mechanics'
  program_path: demo/cbl/COADM01C.cbl
  rule_name: Transfer control to selected administrator function program
  rule_text: WHEN the option validation succeeds and the selected program is not a
    placeholder, THE Administrator Menu Handler SHALL populate the communication area
    with the originating transaction identifier, originating program name, and reset
    program context indicator; transfer control to the selected administrator function
    program via XCTL
