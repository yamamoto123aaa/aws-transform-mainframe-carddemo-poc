  program: COADM01C
  disposition: captured
  program_path: demo/cbl/COADM01C.cbl
  rule_name: Validate and process entered menu option
  rule_text: WHEN the user presses Enter on the administration menu screen, THE Administration
    Menu Option Validator SHALL trim and normalise the option input (`OPTIONI`), convert
    it to a numeric option number (`WS-OPTION`), and display it on screen; if the
    value is non-numeric, out of range (greater than the admin option count (`CDEMO-ADMIN-OPT-COUNT`)),
    or zero, set the error flag (`WS-ERR-FLG`) active, display the message 'Please
    enter a valid option number...', and re-show the menu; if the value is valid but
    the target program is not installed, display 'This option is not installed ...'
    in green and re-show the menu
