- name: TRANEXTR
  type: JCL
  execution: batch
  description: 'Transaction type data extraction and backup; This job extracts transaction
    type and transaction category data from a database and creates backup copies of
    the previous versions. The job performs three sequential operations: backing up
    the current transaction type file to a generation data group, backing up the current
    transaction category file to a generation data group, and then extracting fresh
    transaction type and category data from the database tables, writing the results
    to new datasets. The job uses conditional execution to skip steps if previous
    steps fail, ensuring data integrity throughout the extraction process.'
