  type: JCL
  execution: batch
  description: Transaction consolidation and indexing; This job combines transaction
    records from two sources (backup and system-generated), sorts them by transaction
    identifier in ascending order, and loads the consolidated result into a transaction
    master index. The sort operation merges the two input datasets and produces a
    combined output; the subsequent load operation copies the sorted records into
    the indexed transaction store for fast retrieval.
  transaction_id: null
  calls:
  - IDCAMS
  - SORT
  invokes: IDCAMS, SORT
