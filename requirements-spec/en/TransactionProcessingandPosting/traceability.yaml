  program: CBTRN02C
  disposition: captured
  program_path: demo/cbl/CBTRN02C.cbl
  rule_name: Validate transaction against cross-reference and account data
  rule_text: WHEN a transaction record is ready for validation, THE Transaction Validation
    Engine SHALL look up the card number in the cross-reference file (`XREF-FILE`)
    to retrieve the account ID; if the card is not found, set the validation failure
    reason to 100 ('INVALID CARD NUMBER FOUND'); if the card is found, look up the
    account record in the account file (`ACCOUNT-FILE`) using the account ID; if the
    account is not found, set the validation failure reason to 101 ('ACCOUNT RECORD
    NOT FOUND'); if the account is found, compute the temporary balance as current
    cycle credit minus current cycle debit plus transaction amount, and if this balance
    exceeds the credit limit, set the validation failure reason to 102 ('OVERLIMIT
    TRANSACTION'); also check if the account expiration date is earlier than the transaction
    date, and if so, set the validation failure reason to 103 ('TRANSACTION RECEIVED
    AFTER ACCT EXPIRATION').
