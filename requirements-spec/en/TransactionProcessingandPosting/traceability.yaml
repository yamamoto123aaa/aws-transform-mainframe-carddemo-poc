  rule_text: 'WHEN a transaction record is ready for validation, THE Transaction Validation
    Engine SHALL look up the card number in the card cross-reference file; if not
    found, set validation failure reason to 100; if found, look up the account in
    the account master file; if not found, set validation failure reason to 101; if
    found, compute temporary balance as current cycle credit minus current cycle debit
    plus transaction amount; if temporary balance exceeds credit limit, set validation
    failure reason to 102; if account expiration date is earlier than the transaction
    date, set validation failure reason to 103; otherwise, validation passes with
    failure reason 0. (physical stores: `ACCOUNT-FILE`, `XREF-FILE`)'
