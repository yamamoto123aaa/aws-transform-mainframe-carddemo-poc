- name: CBCUS01C
  type: COBOL
  execution: batch
  description: Customer file sequential read and display; The program opens the customer
    file and sequentially reads records, displaying each customer record to the output.
    The read operation returns a success code when a record is retrieved, an end-of-file
    code when no more records are available, or an error code when the read fails.
    The program terminates when the end-of-file condition is reached.
  transaction_id: null
  data_stores_read: &id004
  - AWS.M2.CARDDEMO.CUSTDATA.VSAM.KSDS
  calls:
  - CEE3ABD
  includes:
