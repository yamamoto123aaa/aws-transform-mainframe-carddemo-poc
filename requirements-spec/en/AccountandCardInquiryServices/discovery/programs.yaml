programs:
- name: CBACT01C
  type: COBOL
  execution: batch
  description: Account record processing and output; The program reads account records
    sequentially from an indexed account file, transforms each record by populating
    an output structure with account details and converting date formats via an external
    date-conversion service, and writes the enriched record to a sequential output
    file. Processing continues until the input file is exhausted, with application
    result codes tracking success, end-of-file, and error conditions.; Account balance
    array file production; This capability reads account records sequentially from
    the account file and writes them to a sequential array-formatted output file.
    Each account record is enriched with hardcoded cycle debit amounts and balance
    values across five array positions before being written. Processing continues
    until all account records have been read, with end-of-file and error conditions
    tracked via an application result code.; Account data variable-block export; This
    capability reads all accounts sequentially from the account data store and writes
    two variable-length output records per account to the variable-block output file.
    The first output record captures the account identifier and active status; the
    second captures the account identifier, current balance, credit limit, and reissue
    year. Processing continues until all accounts have been read, with end-of-file
    and I/O error conditions setting the appropriate application result to control
    loop termination.
  transaction_id: null
  data_stores_read: &id001
  - AWS.M2.CARDDEMO.ACCTDATA.VSAM.KSDS
  data_stores_write:
  - AWS.M2.CARDDEMO.ACCTDATA.ARRYPS
  - AWS.M2.CARDDEMO.ACCTDATA.PSCOMP
  - AWS.M2.CARDDEMO.ACCTDATA.VBPS
  calls:
  - CEE3ABD
  - COBDATFT
  includes:
  - CODATECN
  - CVACT01Y
- name: CBACT02C
  type: COBOL
  execution: batch
  description: Card file batch retrieval and display; The program opens an indexed
    card file and iterates through its records sequentially. For each record successfully
    retrieved, the program displays the card record. The iteration continues until
    the end of the file is reached or an error occurs. The application result code
    is set to indicate success (0), end-of-file (16), or other errors (12).
  transaction_id: null
