- name: CBACT03C
  type: COBOL
  execution: batch
  description: Card cross-reference file retrieval and display; The program opens
    a card cross-reference file (XREFFILE) and iterates through its records sequentially.
    For each record successfully read, the program displays the card cross-reference
    record. The loop terminates when the end of file is reached or when a file I/O
    error occurs.
  transaction_id: null
  data_stores_read: &id003
  - AWS.M2.CARDDEMO.CARDXREF.VSAM.KSDS
  calls:
  - CEE3ABD
  includes:
